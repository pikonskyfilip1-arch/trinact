<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Třináct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --cream: #FAF7F2; --accent: #C4714A; --dark: #2A1F1A; --muted: #8A7060; }
body {
  min-height: 100vh; background: var(--cream);
  font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem; overflow: hidden;
}
.container { text-align: center; max-width: 480px; width: 100%; }

/* Big number animation */
.big-num {
  font-family: 'Playfair Display', serif;
  font-size: 140px; font-weight: 400; color: var(--accent);
  line-height: 1; opacity: 0;
  animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.4); }
  to   { opacity: 1; transform: scale(1); }
}

.label {
  font-family: 'Playfair Display', serif; font-size: 18px;
  color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase;
  opacity: 0; animation: fadeUp 0.6s ease 1s forwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.weeks-label {
  font-size: 13px; color: var(--muted); margin-top: 0.25rem;
  opacity: 0; animation: fadeUp 0.6s ease 1.3s forwards;
}

.divider { width: 40px; height: 1px; background: #E8C4B0; margin: 2rem auto; opacity: 0; animation: fadeUp 0.6s ease 1.5s forwards; }

.message {
  font-family: 'Playfair Display', serif; font-size: 19px;
  color: var(--dark); line-height: 1.6;
  opacity: 0; animation: fadeUp 0.6s ease 1.8s forwards;
}
.message em { color: var(--accent); font-style: italic; }

.sub-msg {
  font-size: 13px; color: var(--muted); margin-top: 1rem; line-height: 1.7;
  opacity: 0; animation: fadeUp 0.6s ease 2.1s forwards;
}

.hearts {
  margin-top: 2rem; font-size: 22px; letter-spacing: 0.3em;
  opacity: 0; animation: fadeUp 0.6s ease 2.4s forwards;
}

/* Floating dots bg */
.dot-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.fdot {
  position: absolute; border-radius: 50%;
  background: var(--accent); opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(0) scale(1); opacity: 0; }
  10%  { opacity: 0.15; }
  90%  { opacity: 0.08; }
  100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
}
.container { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="dot-bg" id="dotbg"></div>
<div class="container">
  <div class="big-num">13</div>
  <div class="label">týdnů</div>
  <div class="weeks-label">tolik času budeme od sebe</div>
  <div class="divider"></div>
  <div class="message">
    Proto jsem ti doma schoval<br>
    <em>očíslovaných 13 papírků</em><br>
    s důvody proč a co na tobě miluju.
  </div>
  <div class="sub-msg">
    Těch důvodů je samozřejmě daleko víc.<br>
    Ale tenhle počet mi přišel jako správný začátek.
  </div>
  <div class="hearts">🧡 🧡 🧡</div>
</div>

<script>
// Generate floating dots
const bg = document.getElementById('dotbg');
for (let i = 0; i < 18; i++) {
  const d = document.createElement('div');
  d.className = 'fdot';
  const size = Math.random() * 8 + 4;
  d.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}%;
    bottom:${Math.random()*20-10}%;
    animation-duration:${6+Math.random()*8}s;
    animation-delay:${Math.random()*6}s;
  `;
  bg.appendChild(d);
}
</script>
</body>
</html>
